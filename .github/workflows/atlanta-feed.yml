# Runs the God's Eye Atlanta public-record feed on GitHub's runners, where the
# city / county / FEMA / Census / MARTA servers are reachable. Triggered by a
# change to tools/atlanta-intel/run-request.json on a claude/* branch, or by
# hand (Actions → Atlanta feed → Run workflow) once this file is on main.
# The output holds owner names from public records, so it is NEVER committed
# or uploaded as a run artifact (artifacts on a public repo are downloadable):
# it goes only to a private Supabase Storage bucket, and only when the repo
# secrets SUPABASE_URL + SUPABASE_SERVICE_ROLE_KEY exist. The public run log
# shows counts and scores, never addresses or owners.
name: Atlanta feed

on:
  push:
    branches: ["claude/**"]
    paths: ["tools/atlanta-intel/run-request.json"]
  schedule:
    - cron: "17 9 * * *" # daily refresh (runs from the default branch)
  workflow_dispatch:
    inputs:
      mode:
        description: "discover | feed"
        default: "feed"
      zips:
        description: "ZIPs to sweep (space-separated)"
        default: "30310 30314 30315 30318"
      since:
        description: "Days of permits to pull"
        default: "730"

permissions:
  contents: read

concurrency:
  group: atlanta-feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Run
        shell: bash # -eo pipefail, so a failed run fails the step despite tee
        env:
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_ZIPS: ${{ github.event.inputs.zips }}
          INPUT_SINCE: ${{ github.event.inputs.since }}
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: node tools/atlanta-intel/ci.mjs 2>&1 | tee run.log
      - name: Store privately
        if: success()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -f data/atlanta-intel.json ]; then
            node tools/atlanta-intel/upload-private.mjs data/atlanta-intel.json data/deal-intel-import.csv dist/godseye-preview.html
          fi
