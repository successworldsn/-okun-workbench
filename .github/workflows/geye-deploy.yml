# Optional CI deploy of geye.successagenticlabs.com (assets-only Cloudflare
# Worker, deploy/geye/wrangler.jsonc). The normal path is a laptop deploy with
# wrangler's OAuth login, after you say deploy. This workflow runs only:
#   - by hand (Actions -> geye deploy -> Run workflow), or
#   - after each weekly GA infrastructure feed, if the repo variable
#     GEYE_AUTO_DEPLOY is "true" (you opt in to weekly data refreshes).
# Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; without
# them it builds the site and stops. Public data only: /deals is EXAMPLE data.
name: geye deploy

on:
  workflow_run:
    workflows: ["GA infrastructure feed"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geye-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (vars.GEYE_AUTO_DEPLOY == 'true' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # After a feed run, deploy what the feed just committed.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build the site
        run: node deploy/geye/build-site.mjs
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; built the site but did not deploy."
            exit 0
          fi
          npx --yes wrangler@4 deploy -c deploy/geye/wrangler.jsonc
          echo "Live: https://geye.successagenticlabs.com"
