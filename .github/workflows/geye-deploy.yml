# Weekly refresh of geye.successagenticlabs.com (assets-only Cloudflare Worker,
# deploy/geye/wrangler.jsonc). The owner opted in to weekly refreshes
# (2026-10-08): after each successful Monday GA infrastructure feed on main,
# this rebuilds the site with the new data and deploys it. It can also be run by
# hand (Actions -> geye deploy -> Run workflow). Needs repo secrets
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; without them it builds the
# site and stops. Public data only: /deals is EXAMPLE data.
name: geye deploy

on:
  workflow_run:
    workflows: ["GA infrastructure feed"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geye-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # After a feed run, deploy what the feed just committed.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build the site
        run: node deploy/geye/build-site.mjs
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; built the site but did not deploy."
            exit 0
          fi
          npx --yes wrangler@4 deploy -c deploy/geye/wrangler.jsonc 2>&1 | tee deploy.log
          # Version ids for the record ("LIVE <date>, version X; rollback Y").
          echo "### geye deployed $(date -u +%Y-%m-%d)" >> "$GITHUB_STEP_SUMMARY"
          grep -i "version id" deploy.log >> "$GITHUB_STEP_SUMMARY" || true
          echo "Live: https://geye.successagenticlabs.com" >> "$GITHUB_STEP_SUMMARY"
